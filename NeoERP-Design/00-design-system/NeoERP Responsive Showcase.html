<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NeoERP — Responsive Showcase</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f3f3f1;
    --ink: #111;
    --ink-2: #555;
    --ink-3: #888;
    --line: #d6d4cf;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    transition: background 350ms ease, color 350ms ease;
  }

  /* ─── STAGES ─── */
  body[data-stage="showroom"] { --bg: #0e0e10; --ink: #f5f5f3; --ink-2: #b9b8b4; --ink-3: #6e6e6c; --line: #232325; }
  body[data-stage="showroom"] .url { background: #1a1a1c; color: #999; border-color: #2a2a2c; }
  body[data-stage="showroom"] .nav a { background: #1a1a1c; border-color: #2a2a2c; color: #b9b8b4; }
  body[data-stage="showroom"] .chrome { background: #1a1a1c; border-bottom-color: #2a2a2c; }
  body[data-stage="showroom"] .desktop { background: #1a1a1c; }
  body[data-stage="showroom"] .trio::before {
    content: ''; position: absolute; inset: -10% -5% -20% -5%;
    background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.08), transparent 65%);
    pointer-events: none; z-index: 0;
  }
  body[data-stage="showroom"] .device { z-index: 1; }
  body[data-stage="showroom"] .desktop, body[data-stage="showroom"] .phone, body[data-stage="showroom"] .tablet {
    box-shadow:
      0 1px 0 1px rgba(255,255,255,.04),
      0 80px 120px -30px rgba(0,0,0,.7),
      0 30px 60px -20px rgba(0,0,0,.5);
  }

  body[data-stage="blueprint"] {
    --bg: #eef2f7;
    --ink: #0a2540;
    --ink-2: #4a6585;
    --ink-3: #7d97b8;
    --line: #c7d4e3;
    background-image:
      linear-gradient(to right, rgba(10,37,64,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10,37,64,.06) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  body[data-stage="blueprint"] .device::after {
    content: attr(data-dim);
    position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    font-size: 10.5px; font-weight: 600; color: #2a4d75;
    background: #fff; border: 1px solid #c7d4e3;
    padding: 4px 10px; border-radius: 4px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  body[data-stage="blueprint"] .device-label {
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    color: #2a4d75;
  }
  body[data-stage="blueprint"] .section-num {
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace;
    color: #2a4d75;
  }
  body[data-stage="blueprint"] .section { background: rgba(255,255,255,.4); }

  /* ─── ARRANGEMENTS ─── */
  .trio {
    padding: 20px 64px 60px;
    position: relative;
  }
  body[data-arrange="trio"] .trio {
    display: flex; align-items: flex-start; gap: 80px;
    overflow-x: auto;
  }
  body[data-arrange="trio"] .device-label { top: -32px; }

  body[data-arrange="stack"] .trio {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-areas: "desk" "tab-phone";
    gap: 100px;
    place-items: center;
    padding: 60px 64px 100px;
  }
  body[data-arrange="stack"] .desktop { grid-area: desk; }
  body[data-arrange="stack"] .tablet, body[data-arrange="stack"] .phone {
    display: inline-block; vertical-align: top;
  }
  body[data-arrange="stack"] .tablet { margin-right: 80px; }

  body[data-arrange="cascade"] .trio {
    display: block;
    position: relative;
    height: 1280px;
    padding: 80px 64px 100px;
    overflow: visible;
  }
  body[data-arrange="cascade"] .desktop {
    position: absolute; top: 80px; left: 64px;
    transform: scale(0.85) translateX(-30px);
    transform-origin: top left;
    z-index: 1;
  }
  body[data-arrange="cascade"] .tablet {
    position: absolute; top: 200px; left: 50%;
    transform: translateX(-30%) scale(0.78);
    transform-origin: top left;
    z-index: 2;
  }
  body[data-arrange="cascade"] .phone {
    position: absolute; top: 320px; right: 64px;
    transform: scale(0.92);
    transform-origin: top right;
    z-index: 3;
  }
  body[data-arrange="cascade"] .device-label { top: -28px; }

  /* ─── FRAME FIDELITY ─── */
  /* Realistic is the default */

  body[data-fidelity="wireframe"] .phone,
  body[data-fidelity="wireframe"] .tablet {
    background: transparent;
    border: 1.5px solid var(--ink);
    box-shadow: none;
    padding: 8px;
  }
  body[data-fidelity="wireframe"] .phone .screen,
  body[data-fidelity="wireframe"] .tablet .screen {
    border: 1px dashed var(--line);
    border-radius: 30px;
  }
  body[data-fidelity="wireframe"] .tablet .screen { border-radius: 14px; }
  body[data-fidelity="wireframe"] .phone .notch {
    background: var(--ink); width: 80px; height: 22px;
  }
  body[data-fidelity="wireframe"] .desktop {
    background: transparent;
    border: 1.5px solid var(--ink);
    box-shadow: none;
  }
  body[data-fidelity="wireframe"] .desktop .chrome {
    background: transparent; border-bottom: 1.5px solid var(--ink);
  }
  body[data-fidelity="wireframe"] .dots span { background: transparent !important; border: 1px solid var(--ink); }

  body[data-fidelity="clay"] .phone {
    background: #d8d4cb;
    border-radius: 56px;
    padding: 18px;
    box-shadow:
      inset 0 -8px 16px rgba(0,0,0,.05),
      inset 0 4px 8px rgba(255,255,255,.7),
      0 40px 60px -20px rgba(0,0,0,.18);
  }
  body[data-fidelity="clay"] .phone .screen { border-radius: 40px; }
  body[data-fidelity="clay"] .phone .notch { background: #d8d4cb; }
  body[data-fidelity="clay"] .tablet {
    background: #d8d4cb;
    border-radius: 40px;
    padding: 22px;
    box-shadow:
      inset 0 -8px 16px rgba(0,0,0,.05),
      inset 0 4px 8px rgba(255,255,255,.7),
      0 50px 80px -20px rgba(0,0,0,.18);
  }
  body[data-fidelity="clay"] .tablet .screen { border-radius: 22px; }
  body[data-fidelity="clay"] .desktop {
    border-radius: 22px;
    box-shadow:
      inset 0 -6px 12px rgba(0,0,0,.04),
      inset 0 3px 6px rgba(255,255,255,.7),
      0 50px 80px -20px rgba(0,0,0,.18);
  }
  body[data-stage="showroom"][data-fidelity="clay"] .phone,
  body[data-stage="showroom"][data-fidelity="clay"] .tablet,
  body[data-stage="showroom"][data-fidelity="clay"] .desktop {
    background: #2a2a2c;
    box-shadow:
      inset 0 -6px 12px rgba(0,0,0,.4),
      inset 0 3px 6px rgba(255,255,255,.04),
      0 50px 80px -20px rgba(0,0,0,.6);
  }
  body[data-stage="showroom"][data-fidelity="clay"] .phone .notch { background: #2a2a2c; }

  /* ─── Page chrome ─── */
  .header { padding: 56px 64px 28px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--ink-3); text-transform: uppercase; margin-bottom: 14px; }
  .h1 { font-size: 38px; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 10px; line-height: 1.1; }
  .lede { font-size: 15px; color: var(--ink-2); max-width: 680px; line-height: 1.5; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 22px; }
  .nav a { font-size: 12.5px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 7px 14px; text-decoration: none; transition: all 200ms; }
  .nav a:hover { border-color: var(--ink); color: var(--ink); }
  .section { padding: 64px 0; border-bottom: 1px solid var(--line); transition: background 350ms ease; }
  .section-head { padding: 0 64px; margin-bottom: 36px; display: flex; align-items: baseline; gap: 16px; }
  .section-num { font-size: 12px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
  .section-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .section-sub { font-size: 14px; color: var(--ink-2); margin-left: auto; }

  .device { flex-shrink: 0; position: relative; transition: all 400ms cubic-bezier(.2,.8,.2,1); }
  .device-label { position: absolute; top: -32px; left: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .device-label .dim { color: var(--ink-3); opacity: 0.6; margin-left: 8px; font-weight: 500; }

  .phone { width: 390px; height: 844px; background: #0a0a0a; border-radius: 48px; padding: 14px; box-shadow: 0 1px 0 1px rgba(0,0,0,.05), 0 50px 80px -30px rgba(0,0,0,.3), 0 30px 50px -20px rgba(0,0,0,.2); transition: all 400ms; }
  .phone .screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #fff; position: relative; transition: border-radius 400ms; }
  .phone .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 116px; height: 32px; background: #0a0a0a; border-radius: 18px; z-index: 5; transition: all 400ms; }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; }

  .tablet { width: 820px; height: 1180px; background: #1a1a1a; border-radius: 32px; padding: 16px; box-shadow: 0 1px 0 1px rgba(0,0,0,.05), 0 60px 100px -30px rgba(0,0,0,.3), 0 30px 60px -20px rgba(0,0,0,.2); transition: all 400ms; }
  .tablet .screen { width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: #fff; transition: border-radius 400ms; }
  .tablet iframe { width: 820px; height: 1180px; border: 0; display: block; }

  .desktop { width: 1440px; background: #fff; border-radius: 12px; box-shadow: 0 1px 0 1px rgba(0,0,0,.05), 0 50px 100px -30px rgba(0,0,0,.25); overflow: hidden; transition: all 400ms; }
  .desktop .chrome { height: 38px; background: #ececea; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid #d6d4cf; transition: all 400ms; }
  .dots { display: flex; gap: 7px; }
  .dots span { width: 11px; height: 11px; border-radius: 999px; }
  .dots span:nth-child(1) { background: #ff5f57; }
  .dots span:nth-child(2) { background: #febc2e; }
  .dots span:nth-child(3) { background: #28c840; }
  .url { flex: 1; max-width: 480px; background: #fafafa; border: 1px solid #e2e0db; border-radius: 6px; height: 22px; padding: 0 10px; display: flex; align-items: center; font-size: 11.5px; color: #777; margin: 0 auto; }
  .desktop iframe { width: 1440px; height: 900px; border: 0; display: block; }

  .footer { padding: 40px 64px 80px; color: var(--ink-3); font-size: 12.5px; text-align: center; }
</style>
</head>
<body data-stage="studio" data-arrange="trio" data-fidelity="realistic">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, createContext, useContext, useLayoutEffect } = React;
Object.assign(window, { useState, useEffect, useMemo, useRef, createContext, useContext, useLayoutEffect });
</script>
<script type="text/babel" src="tweaks-panel.jsx" data-presets="react"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "stage": "studio",
  "arrange": "cascade",
  "fidelity": "clay"
}/*EDITMODE-END*/;

const SCREENS = [
  { id: 'auth',      route: 'signin',     n: '01', title: 'Sign In', sub: 'Auth flow entry' },
  { id: 'forgot',    route: 'forgot',     n: '02', title: 'Forgot Password' },
  { id: 'reset',     route: 'reset',      n: '03', title: 'Reset Password' },
  { id: 'dashboard', route: 'dashboard',  n: '04', title: 'Super Admin Dashboard', sub: 'KPIs · trends · activity' },
  { id: 'companies', route: 'companies',  n: '05', title: 'Companies', sub: 'List + filters' },
  { id: 'company',   route: 'company:c1', n: '06', title: 'Company Detail', sub: 'Tabs · modules · branches · warehouses' },
  { id: 'enroll',    route: 'enroll',     n: '07', title: 'Enroll Company Wizard', sub: '6-step flow' },
  { id: 'admins',    route: 'admins',     n: '08', title: 'Super Admin Users' },
  { id: 'admin',     route: 'admin:u1',   n: '09', title: 'Admin User Detail' },
];
const PROTO = 'NeoERP Super Admin.html';

function Trio({ s }) {
  return (
    <div className="trio">
      <div className="device desktop" data-dim="1440 × 900 px">
        <div className="device-label">Desktop <span className="dim">1440 × 900</span></div>
        <div className="chrome"><div className="dots"><span/><span/><span/></div><div className="url">app.neoerp.com/{s.route.replace(':','/')}</div></div>
        <iframe loading="lazy" src={`${PROTO}#${s.route}`}/>
      </div>
      <div className="device tablet" data-dim="820 × 1180 px">
        <div className="device-label">Tablet <span className="dim">820 × 1180</span></div>
        <div className="screen"><iframe loading="lazy" src={`${PROTO}#${s.route}`}/></div>
      </div>
      <div className="device phone" data-dim="390 × 844 px">
        <div className="device-label">Phone <span className="dim">390 × 844</span></div>
        <div className="screen"><div className="notch"/><iframe loading="lazy" src={`${PROTO}#${s.route}`}/></div>
      </div>
    </div>
  );
}

function Section({ s }) {
  return (
    <section className="section" id={s.id}>
      <div className="section-head">
        <span className="section-num">{s.n}</span>
        <h2 className="section-title">{s.title}</h2>
        {s.sub && <span className="section-sub">{s.sub}</span>}
      </div>
      <Trio s={s}/>
    </section>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    document.body.setAttribute('data-stage', t.stage);
    document.body.setAttribute('data-arrange', t.arrange);
    document.body.setAttribute('data-fidelity', t.fidelity);
  }, [t.stage, t.arrange, t.fidelity]);

  return (
    <>
      <div className="header">
        <div className="eyebrow">NeoERP — Super Admin Console</div>
        <h1 className="h1">Responsive showcase</h1>
        <p className="lede">Every screen rendered at three breakpoints — desktop (1440), tablet (820), and phone (390). Use the Tweaks panel to reshape the presentation.</p>
        <nav className="nav">
          {SCREENS.map(s => <a key={s.id} href={`#${s.id}`}>{s.title}</a>)}
        </nav>
      </div>

      {SCREENS.map(s => <Section key={s.id} s={s}/>)}

      <div className="footer">NeoERP Super Admin · Same prototype, three breakpoints</div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Stage"/>
        <TweakRadio
          label="Mood"
          value={t.stage}
          options={['studio','showroom','blueprint']}
          onChange={(v) => setTweak('stage', v)}
        />
        <TweakSection label="Arrangement"/>
        <TweakRadio
          label="Layout"
          value={t.arrange}
          options={['trio','stack','cascade']}
          onChange={(v) => setTweak('arrange', v)}
        />
        <TweakSection label="Frame fidelity"/>
        <TweakRadio
          label="Bezels"
          value={t.fidelity}
          options={['realistic','wireframe','clay']}
          onChange={(v) => setTweak('fidelity', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
